name: Keep Supabase awake

on:
  schedule:
    # Lundi et jeudi 12:00 UTC — évite la pause free-tier (7 jours d'inactivité)
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://wqoqvplcetliwdcaoxve.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing secret SUPABASE_ANON_KEY"
            exit 1
          fi
          code=$(curl -s -o /tmp/out -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/practitioner_profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/out
          # 200 = OK, 401/406 = API up but auth/headers — still counts as activity
          case "$code" in
            200|401|406) exit 0 ;;
            *) exit 1 ;;
          esac
