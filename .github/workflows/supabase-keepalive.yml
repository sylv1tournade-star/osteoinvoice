name: Keep Supabase awake

on:
  schedule:
    # Tous les jours 12:00 UTC — le free-tier pause après 7 jours d'inactivité
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure project is active then ping
        env:
          PROJECT_REF: wqoqvplcetliwdcaoxve
          SUPABASE_URL: https://wqoqvplcetliwdcaoxve.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secret SUPABASE_ANON_KEY"
            exit 1
          fi

          status=$(curl -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status')
          echo "Project status: $status"

          if [ "$status" = "INACTIVE" ]; then
            echo "Project paused — restoring…"
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/restore"
            for i in $(seq 1 36); do
              status=$(curl -sS \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status')
              echo "Waiting… status=$status ($i/36)"
              if [ "$status" = "ACTIVE_HEALTHY" ] || [ "$status" = "ACTIVE_UNHEALTHY" ]; then
                break
              fi
              sleep 10
            done
          fi

          if [ "$status" != "ACTIVE_HEALTHY" ] && [ "$status" != "ACTIVE_UNHEALTHY" ]; then
            echo "Project not active after wait: $status"
            exit 1
          fi

          code=$(curl -sS -o /tmp/out -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/practitioner_profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
          echo "HTTP $code"
          cat /tmp/out || true
          case "$code" in
            200|401|406) exit 0 ;;
            *) exit 1 ;;
          esac
